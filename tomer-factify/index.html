<div class="ol-mh"><div class="ol-av" style="background: #8a5cf6">WC</div><div><div class="ol-who">Williamson C. <span>&lt;williamson.c@bankin.com&gt; · Chief Credit Officer</span></div><div class="ol-to">To: Bradford G.</div></div><div class="ol-dt">Mon 29/12/2026 10:12</div></div>
<div class="ol-body"><p>Dear Brad,</p><p>The <span class="ol-tag">DSCR<span class="ol-tip"><b>Debt service coverage ratio.</b> Canonical minimum for CRE is 1.25x in Credit Policy v4.2 §3.4.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> in this loan can perfectly be <span class="ol-tag warn">1.20x<span class="ol-tip"><b>Conflicts with a canonical fact.</b> DSCR minimum for CRE is 1.25x in Credit Policy v4.2 §3.4. This value appears in 2 e-mails and 1 analyst model.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span>. I approve it, just make sure all team is aligned.</p><p>Best,<br>Williamson</p></div>
</div>
<div class="ol-msg ol-in" style="animation-delay: 1.38s">
<div class="ol-mh"><div class="ol-av" style="background: #0f6cbd">BG</div><div><div class="ol-who">Bradford G. <span>&lt;bradford.g@bankin.com&gt; · Relationship Manager</span></div><div class="ol-to">To: Williamson C. &nbsp;Cc: Credit Policy</div></div><div class="ol-dt">Mon 29/12/2026 10:48</div></div>
<div class="ol-body"><p>Hi Williamson,</p><p>Thanks for the quick approval. Just to flag: <span class="ol-tag">Credit Policy v4.2 §3.4<span class="ol-tip"><b>Canonical source.</b> In force since Jan 2025. Owned by Credit Policy, Commercial Lending.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> still sets the <span class="ol-tag">DSCR minimum<span class="ol-tip"><b>Canonical fact · 1.25x for CRE.</b> Used by 14 RMs and the lending agent.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> for CRE at <span class="ol-tag">1.25x<span class="ol-tip"><b>Canonical value.</b> Matches Credit Policy v4.2 §3.4.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span>, so <span class="ol-tag warn">1.20x<span class="ol-tip"><b>Conflicts with a canonical fact.</b> DSCR minimum for CRE is 1.25x in Credit Policy v4.2 §3.4. This value appears in 2 e-mails and 1 analyst model.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> on <span class="ol-tag">Loan #4471<span class="ol-tip"><b>Closes Tuesday.</b> Flagged to its RM because its DSCR depends on this decision.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> sits below it. I understand this is for <span class="ol-tag">owner-occupied<span class="ol-tip"><b>Not a scope in policy today.</b> Recording a carve-out would make it one.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> properties only. I'll note it in the credit file and make sure the team is aligned before Tuesday's closing.</p><p>Thanks again,<br>Brad</p></div>

<h1 class="ex-in" style="animation-delay: .8s">Bank's Credit and Loans Policy V4.2</h1>
<div class="wd-meta ex-in" style="animation-delay: .9s">Effective January 2025 · Owner: Credit Policy · Approved by the Board of Directors</div>
<h2 class="ex-in" style="animation-delay: 1.0s">3.4 Debt service coverage</h2>
<p class="ex-in" style="animation-delay: 1.08s">Commercial real estate loans must show a minimum DSCR of <span class="ol-tag">1.25x<span class="ol-tip"><b>Canonical fact · DSCR minimum for CRE.</b> v4.3 keeps 1.25x but changes the DSCR definition to include a lease adjustment.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span>, calculated as <span class="ol-tag warn">net operating income<span class="ol-tip"><b>Definition would change.</b> v4.3 adds a lease adjustment to NOI in the DSCR calculation.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> divided by annual debt service over the trailing twelve months. Exceptions require Credit Committee approval and must be recorded in the credit file.</p>
<h2 class="ex-in" style="animation-delay: 1.16s">4.2 Collateral and loan-to-value</h2>
<p class="ex-in" style="animation-delay: 1.24s">The maximum loan-to-value for real estate collateral is <span class="ol-tag warn">70%<span class="ol-tip"><b>Would change to 65%.</b> Credit Policy v4.3, board approved on 28 Sep, lowers max LTV for real estate.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> of the appraised value at origination. Appraisals must be no older than twelve months and ordered through the bank's approved panel.</p>
<h2 class="ex-in" style="animation-delay: 1.32s">5.1 Annual review</h2>
<p class="ex-in" style="animation-delay: 1.4s">Every commercial exposure above <span class="ol-tag warn">$5M<span class="ol-tip"><b>Would change to $3M.</b> v4.3 lowers the annual review threshold, so more loans get a yearly review.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> receives a full annual review, including updated financials, covenant testing and a refreshed risk rating.</p>
<p class="ex-in" style="animation-delay: 1.48s">Relationship managers are responsible for collecting the information on time. Credit Policy reviews this document at least once a year.</p>

<h1 class="ex-in" style="animation-delay: .8s">Bank's Credit and Loans Policy V4.3</h1>
<div class="wd-meta ex-in" style="animation-delay: .9s">Board approved 28 Sep 2026 · Owner: Credit Policy · Not yet in force</div>
<h2 class="ex-in" style="animation-delay: 1.0s">3.4 Debt service coverage</h2>
<p class="ex-in" style="animation-delay: 1.08s">Commercial real estate loans must show a minimum DSCR of <span class="ol-tag">1.25x<span class="ol-tip"><b>Unchanged · DSCR minimum for CRE.</b> Same as v4.2, but NOI now includes a lease adjustment.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span>, calculated as <span class="ol-tag warn">net operating income with a lease adjustment<span class="ol-tip"><b>New definition.</b> v4.2 uses plain NOI. Adopting v4.3 changes how DSCR is calculated on every CRE loan.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> divided by annual debt service over the trailing twelve months. Exceptions require Credit Committee approval and must be recorded in the credit file.</p>
<h2 class="ex-in" style="animation-delay: 1.16s">4.2 Collateral and loan-to-value</h2>
<p class="ex-in" style="animation-delay: 1.24s">The maximum loan-to-value for real estate collateral is <span class="ol-tag warn">65%<span class="ol-tip"><b>Supersedes 70%.</b> v4.2, in force today, allows 70%. 23 open CRE loans sit between 65% and 70%.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> of the appraised value at origination. Appraisals must be no older than twelve months and ordered through the bank's approved panel.</p>
<h2 class="ex-in" style="animation-delay: 1.32s">5.1 Annual review</h2>
<p class="ex-in" style="animation-delay: 1.4s">Every commercial exposure above <span class="ol-tag warn">$3M<span class="ol-tip"><b>Supersedes $5M.</b> 41 more exposures would need a full annual review each year.<button class="ol-go" onClick="{{ olPing }}" aria-label="Show in Factify"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button></span></span> receives a full annual review, including updated financials, covenant testing and a refreshed risk rating.</p>
<p class="ex-in" style="animation-delay: 1.48s">Relationship managers are responsible for collecting the information on time. Credit Policy reviews this document at least once a year.</p>

by a current appraisal and rent roll.</p><div class="wp-hl">3.4 DSCR minimum for CRE: <b>1.25x</b></div><p>DSCR is net operating income divided by annual debt service over the trailing twelve months. Loans below the minimum need Credit Committee approval and a documented mitigant.</p><p>Owner-occupied properties follow the same minimum unless a carve-out is approved.</p></div><div class="wp-page"><span class="wp-num">4</span><h6>4. Collateral</h6><p>Collateral is valued at origination and at each annual review. Appraisals older than twelve months are not accepted.</p><div class="wp-hl">4.2 Max LTV Real Estate: <b>70%</b></div><p>Loan-to-value is the loan amount divided by the appraised value. Construction loans are capped at 65% of the completed value.</p><p>Personal guarantees do not replace the LTV limit.</p></div><div class="wp-page"><span class="wp-num">5</span><h6>5. Monitoring and review</h6><p>Every exposure is risk-rated at origination and re-rated when covenants are breached.</p><div class="wp-hl">5.1 Annual review threshold: <b>$5M</b></div><p>Exposures above the threshold receive a full annual review with updated financials and covenant testing.</p><div class="wp-sign"><i></i><em>Approved · Board of Directors · Jan 2025</em></div></div></div></div>
